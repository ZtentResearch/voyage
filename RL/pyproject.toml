[project]
name = "rl"
version = "0.1.0"
description = "Reinforcement-learning research environment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium[atari,classic-control]==1.3.0",
    "moviepy==2.2.1",
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "pytorch-ignite==0.5.5",
    "ray[tune]==2.58.0",
    "stable-baselines3==2.9.0",
    "tensorboard==2.21.0",
    "torch==2.13.0",
    "torchrl==0.13.3",
    "torchvision==0.28.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
]
